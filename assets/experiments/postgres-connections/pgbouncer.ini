[databases]
lab = host=postgres port=5432 dbname=lab
[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/users.txt
pool_mode = transaction
default_pool_size = 5
reserve_pool_size = 0
max_client_conn = 150
server_idle_timeout = 600
admin_users = lab
pidfile = /tmp/pgbouncer.pid
